name: Build HandStop EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python mediapipe psutil pyttsx3 pywin32 keyboard pyinstaller

    - name: Build EXE
      shell: pwsh
      run: |
        pyinstaller --onefile --noconsole `
          --name HandStop `
          --collect-all mediapipe `
          --collect-all cv2 `
          --hidden-import win32gui `
          --hidden-import win32process `
          --hidden-import win32api `
          --hidden-import win32con `
          handstop.py

    - name: Upload EXE
      uses: actions/upload-artifact@v5
      with:
        name: HandStop-Windows
        path: |
          dist/HandStop.exe
          config.json

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: HandStop v1.0.${{ github.run_number }}
        files: |
          dist/HandStop.exe
          config.json
